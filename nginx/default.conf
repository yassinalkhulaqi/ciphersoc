# cipherSOC reverse proxy: frontend + API + WebSocket
upstream ciphersoc_api { server backend:8000; }
upstream ciphersoc_ws { server websocket:8080; }
upstream ciphersoc_ui { server frontend:80; }

server {
  listen 80;
  client_max_body_size 5m;

  # Security headers (defense in depth with Laravel SecurityHeaders middleware)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # gzip for API JSON + SPA assets
  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  location /api/ { proxy_pass http://ciphersoc_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 30s; }
  location /up { proxy_pass http://ciphersoc_api; access_log off; }

  # Laravel Reverb WebSocket
  location /app/ {
    proxy_pass http://ciphersoc_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / { proxy_pass http://ciphersoc_ui; proxy_set_header Host $host; }
}
