# cipherSOC reverse proxy: frontend + API + WebSocket
upstream ciphersoc_api { server backend:8000; }
upstream ciphersoc_ws { server websocket:8080; }
upstream ciphersoc_ui { server frontend:80; }

server {
  listen 80;
  client_max_body_size 5m;

  location /api/ { proxy_pass http://ciphersoc_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /up { proxy_pass http://ciphersoc_api; }

  # Laravel Reverb WebSocket
  location /app/ {
    proxy_pass http://ciphersoc_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / { proxy_pass http://ciphersoc_ui; proxy_set_header Host $host; }
}
