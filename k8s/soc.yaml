apiVersion: v1
kind: Namespace
metadata:
  name: ciphersoc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ciphersoc
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ciphersoc/backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: ciphersoc-secrets } }]
          livenessProbe: { httpGet: { path: /up, port: 8000 }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /up, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 1000m, memory: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: ciphersoc
spec:
  replicas: 2
  selector:
    matchLabels: { app: queue-worker }
  template:
    metadata:
      labels: { app: queue-worker }
    spec:
      containers:
        - name: worker
          image: ciphersoc/backend:latest
          command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120"]
          envFrom: [{ secretRef: { name: ciphersoc-secrets } }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 1000m, memory: 1Gi } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: queue-worker
  namespace: ciphersoc
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: queue-worker }
  minReplicas: 2
  maxReplicas: 8
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
